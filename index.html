<!-- این بخش را داخل index.html، قبل از </main> قرار بده -->

<section id="files" class="section">
  <div class="section-head">
    <span>فایل‌های جدید</span>
    <h2>آخرین فایل‌های ثبت‌شده</h2>
  </div>

  <div id="property-list" class="cards">
    <p>در حال دریافت فایل‌ها...</p>
  </div>
</section>

<script>
const SHEET_URL = "YOUR_PUBLIC_SHEET_URL";

async function loadProperties() {
  const box = document.getElementById("property-list");

  try {
    const response = await fetch(SHEET_URL);
    const data = await response.json();

    box.innerHTML = "";

    data.forEach(item => {
      const card = document.createElement("article");
      card.className = "card";

      card.innerHTML = `
        <h3>${item["نوع ملک"] || ""}</h3>
        <p><strong>نوع معامله:</strong> ${item["نوع معامله"] || ""}</p>
        <p><strong>محدوده:</strong> ${item["محدوده"] || ""}</p>
        <p><strong>متراژ:</strong> ${item["متراژ"] || ""}</p>
        <p><strong>خواب:</strong> ${item["تعداد خواب"] || ""}</p>
        <p><strong>سال ساخت:</strong> ${item["سال ساخت"] || ""}</p>
        <p><strong>طبقه:</strong> ${item["طبقه"] || ""}</p>
        <p><strong>قیمت فروش:</strong> ${item["قیمت فروش"] || ""}</p>
        <p><strong>رهن:</strong> ${item["مبلغ رهن"] || ""}</p>
        <p><strong>اجاره:</strong> ${item["اجاره ماهانه"] || ""}</p>
        <p><strong>آدرس:</strong> ${item["آدرس"] || ""}</p>
        <p>${item["توضیحات ملک"] || ""}</p>
        <a class="btn primary"
           href="tel:${item["شماره تماس مالک"] || "09940485573"}">
           تماس
        </a>
      `;

      box.appendChild(card);
    });

  } catch (error) {
    box.innerHTML = "<p>فعلاً فایلی برای نمایش وجود ندارد.</p>";
  }
}

loadProperties();
</script>
